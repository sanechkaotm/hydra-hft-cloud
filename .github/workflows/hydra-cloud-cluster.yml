name: Hydra-HFT v4.0 Cloud Cluster (€150 Manual Validator)

on:
  workflow_dispatch:
    inputs:
      polls:
        description: "Number of live market polls per cloud run"
        required: false
        default: "30"
      capital_eur:
        description: "Starting capital in EUR"
        required: false
        default: "150"

permissions:
  contents: read

jobs:
  hydra-cloud-trinode:
    name: "Hydra-HFT Cloud Linux Server"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Hydra-HFT v4.0 Monorepo
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Build Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compile Hydra-HFT v4.0 Release Binary
        run: cargo build --release

      - name: Run Tests
        run: cargo test --release

      - name: Run Manual Validator
        run: |
          mkdir -p logs
          POLLS="${{ github.event.inputs.polls || '25' }}"
          CAPITAL="${{ github.event.inputs.capital_eur || '150' }}"
          ./target/release/hydra-node --paper-48h --capital "$CAPITAL" --polls "$POLLS"
