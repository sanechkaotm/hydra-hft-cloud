      - SYS_NICE
      - NET_ADMIN
      - IPC_LOCK
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    env_file:
      - ../.env.example
    command: ["--role", "frankfurt", "--dry-run", "--ticks", "100"]
    restart: unless-stopped
